
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Browser - Gestión de Usuarios</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body>

    <div class="container">

        <!-- AUTENTICACIÓN -->
        <section id="authSection">
            <header>
                <h1>🔐 Bienvenido</h1>
                <p>Inicia sesión para acceder a SQLite Browser</p>
            </header>

            <!-- Login -->
            <div id="loginSection" class="form-section">
                <h2>Iniciar sesión</h2>

                <form id="loginForm">
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Correo electrónico"
                        required
                    >

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Contraseña"
                        required
                    >

                    <button type="submit">Iniciar sesión</button>
                </form>

                <p>
                    ¿No tienes una cuenta?
                    <button type="button" id="showRegisterBtn">
                        Crear cuenta
                    </button>
                </p>

                <div id="loginMessage" class="message"></div>
            </div>

            <!-- Registro -->
            <div id="registerSection" class="form-section" hidden>
                <h2>Crear cuenta</h2>

                <form id="registerForm">
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Nombre completo"
                        required
                    >

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Correo electrónico"
                        required
                    >

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Contraseña (mínimo 8 caracteres)"
                        minlength="8"
                        required
                    >

                    <button type="submit">Registrarme</button>
                </form>

                <p>
                    ¿Ya tienes una cuenta?
                    <button type="button" id="showLoginBtn">
                        Iniciar sesión
                    </button>
                </p>

                <div id="registerMessage" class="message"></div>
            </div>
        </section>

        <!-- APLICACIÓN CRUD -->
        <section id="appSection" hidden>

            <header>
                <h1>🗄️ SQLite Browser</h1>
                <p>Gestión de usuarios con TypeScript y SQLite</p>

                <button type="button" id="logoutBtn">
                    Cerrar sesión
                </button>
            </header>

            <!-- Formulario -->
            <section class="form-section">
                <h2>Agregar Usuario</h2>

                <form id="userForm">
                    <input
                        type="text"
                        id="name"
                        placeholder="Nombre completo"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >

                    <button type="submit">➕ Agregar Usuario</button>
                </form>

                <div id="message" class="message"></div>
            </section>

            <!-- Tabla -->
            <section class="table-section">
                <h2>Usuarios Registrados</h2>

                <div class="search-container">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="🔍 Buscar por nombre o correo electrónico..."
                    >

                    <button type="button" id="exportCsvBtn">
                        📥 Exportar CSV
                    </button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="userTableBody"></tbody>
                </table>
            </section>

        </section>

    </div>

    <script type="module" src="/src/main.ts"></script>

</body>
</html>
